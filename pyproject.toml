[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eyepacs-hybrid-ordinal"
version = "0.1.0"
description = "Hybrid contrastive ordinal regression for EyePACS disease grading"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "pandas>=2.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "scikit-learn>=1.3",
    "tensorboard>=2.14",
]

[tool.setuptools.packages.find]
where = ["src"]
