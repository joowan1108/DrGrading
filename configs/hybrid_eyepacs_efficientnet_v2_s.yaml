seed: 42
device: auto

data:
  labels_csv: data/eyepacs/trainLabels.csv
  image_root: data/eyepacs/train
  image_col: null
  label_col: null
  subject_col: null
  image_size: 300
  normalize: none
  batch_size: 24
  num_workers: 4
  max_samples: null
  verify_images: false
  stratified_batches: true
  stratified_min_samples_per_class: 2
  regression_natural_batches: false

split:
  num_folds: 10
  fold_index: 0
  val_size: 0.2
  subject_independent: true

model:
  backbone: efficientnet_v2_s
  pretrained_imagenet: true
  projection_hidden_dim: 1280
  projection_dim: 128
  regression_input: projection_concat
  regression_hidden_dim: 1280
  dropout: 0.0
  num_classes: 5

loss:
  alpha: 1.0
  beta: 1.0
  rmse_weight: 1.0
  mmnp_weight: 2.0
  temperature: 1.0
  ordinal_margin_scale: 1.0
  normalize_ordinal_distance: false
  learnable_ordinal_margins: true
  margin_init: 0.2
  margin_init_jitter: 0.02
  margin_min: 0.05
  margin_lr: 0.00001
  margin_phase1_min_epochs: 20
  margin_phase1_max_epochs: 30
  margin_convergence_tolerance: 0.001
  margin_convergence_patience: 3
  scol_objective: logsumexp
  pcol_updates_learnable_margins: false
  scol_updates_learnable_margins: false
  normalize_learnable_margin_mean: true
  mmnp_reduction: mean
  reduction: mean

train:
  epochs: 75
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0001
  amp: true
  max_grad_norm: 5.0
  lr_plateau_factor: 0.2
  lr_plateau_patience: 5
  early_stopping_patience: 13
  output_dir: checkpoints/hybrid_eyepacs_efficientnet_v2_s_scaled_baseline_plus_mmnp
