seed: 42
device: auto

data:
  labels_csv: data/eyepacs/trainLabels.csv
  image_root: data/eyepacs/train
  image_col: null
  label_col: null
  image_size: 224
  batch_size: 64
  num_workers: 4
  max_samples: null

model:
  backbone: resnet18
  pretrained_imagenet: false
  projection_dim: 128
  hidden_dim: 2048

train:
  epochs: 100
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.0001
  temperature: 0.5
  amp: true
  log_every: 25
  output_dir: checkpoints/simclr_resnet18
