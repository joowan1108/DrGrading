seed: 42
device: auto

data:
  labels_csv: data/eyepacs/trainLabels.csv
  image_root: data/eyepacs/train
  image_col: null
  label_col: null
  image_size: 224
  batch_size: 64
  num_workers: 4
  max_samples: null
  val_size: 0.2

model:
  backbone: resnet18
  checkpoint: checkpoints/simclr_resnet18/best.pt
  num_classes: 5
  freeze_backbone: true

train:
  epochs: 30
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  amp: true
  class_weighted_loss: true
  output_dir: checkpoints/linear_resnet18
